name: Build and Push Production Docker Image

on:
  push:
    branches:
      - main
      - "release/*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: git SHA short)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/omniroute

jobs:
  build-and-push:
    name: Build runner-cli → GHCR
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: meta
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_SHA::7}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Image: ${{ env.GHCR_IMAGE }}:$TAG"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner-cli
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:prod
            ${{ env.GHCR_IMAGE }}:prod-${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=docker-prod
          cache-to: type=gha,scope=docker-prod,mode=max
