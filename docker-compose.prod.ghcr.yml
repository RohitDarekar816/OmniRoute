# ──────────────────────────────────────────────────────────────────────
#  OmniRoute — Docker Compose (Production — GHCR Images)
# ──────────────────────────────────────────────────────────────────────
#
#  Uses pre-built images from GitHub Container Registry (GHCR).
#  No local Docker build required — just pull and run.
#
#  Usage:
#    docker login ghcr.io -u <GITHUB_USER> -p <GITHUB_TOKEN>
#    docker compose -f docker-compose.prod.ghcr.yml up -d
#    docker compose -f docker-compose.prod.ghcr.yml down
#    docker compose -f docker-compose.prod.ghcr.yml pull   # update to latest
#
#  To pin a specific version, set the OMNIROUTE_IMAGE env var:
#    OMNIROUTE_IMAGE=ghcr.io/<owner>/omniroute:prod-abc1234 \
#      docker compose -f docker-compose.prod.ghcr.yml up -d
# ──────────────────────────────────────────────────────────────────────

services:
  # ── Redis (Rate Limiter Backend) ──────────────────────────────────
  redis:
    image: redis:8.6.2-alpine
    container_name: omniroute-redis-prod
    restart: unless-stopped
    volumes:
      - redis-prod-data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  omniroute-prod:
    container_name: omniroute-prod
    depends_on:
      redis:
        condition: service_healthy
    image: ${OMNIROUTE_IMAGE:-ghcr.io/rohitdarekar816/omniroute:prod}
    restart: unless-stopped
    stop_grace_period: 40s
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-20128}
      - DASHBOARD_PORT=${DASHBOARD_PORT:-${PORT:-20128}}
      - API_PORT=${API_PORT:-20129}
      - LIVE_WS_PORT=${LIVE_WS_PORT:-20132}
      - LIVE_WS_HOST=${LIVE_WS_HOST:-0.0.0.0}
      - LIVE_WS_ALLOWED_ORIGINS=${LIVE_WS_ALLOWED_ORIGINS:-http://localhost:${PROD_DASHBOARD_PORT:-20130},http://127.0.0.1:${PROD_DASHBOARD_PORT:-20130}}
      - API_HOST=${API_HOST:-0.0.0.0}
      - HOSTNAME=0.0.0.0
      - DATA_DIR=/app/data
    ports:
      - "${PROD_DASHBOARD_PORT:-20130}:${DASHBOARD_PORT:-${PORT:-20128}}"
      - "${PROD_API_PORT:-20131}:${API_PORT:-20129}"
      - "${PROD_LIVE_WS_PORT:-20132}:${LIVE_WS_PORT:-20132}"
    volumes:
      - omniroute-prod-data:/app/data
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  omniroute-prod-data:
    name: omniroute-prod-data
  redis-prod-data:
    name: redis-prod-data
